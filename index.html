<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive 2.5D map of Malta." />
    <meta name="theme-color" content="#1a6f8a" />
    <title>Malta 2.5D Map</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a6f8a'/%3E%3Cpath d='M17 43 28 18l7 11 5-8 8 22Z' fill='%23e4cfae'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main id="map" aria-label="Interactive 2.5D map of Malta"></main>

    <header class="map-header">
      <div class="island-mark" aria-hidden="true">MT</div>
      <div>
        <h1 class="map-title">Malta 2.5D Map</h1>
        <p class="map-note">Zoom in to raise the buildings</p>
      </div>
    </header>

    <button class="reset-view" id="reset-view" type="button">
      Whole island
    </button>

    <div class="loading" id="loading" aria-live="polite">
      <div class="loading-card">Loading Malta…</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
