<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find Catholic churches and Mass times across Malta and Gozo on an interactive map."
    />
    <meta name="theme-color" content="#1a6f8a" />
    <link rel="canonical" href="https://mass.catholic.mt/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Map Mass" />
    <meta property="og:title" content="MASS NOW - MALTA" />
    <meta
      property="og:description"
      content="Find Catholic churches and Mass times across Malta and Gozo on an interactive map."
    />
    <meta property="og:url" content="https://mass.catholic.mt/" />
    <meta
      property="og:image"
      content="https://mass.catholic.mt/og-image.png"
    />
    <meta
      property="og:image:alt"
      content="A plush toy map of Malta and Gozo with a church and red cross map markers"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MASS NOW - MALTA" />
    <meta
      name="twitter:description"
      content="Find Catholic churches and Mass times across Malta and Gozo on an interactive map."
    />
    <meta
      name="twitter:image"
      content="https://mass.catholic.mt/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="A plush toy map of Malta and Gozo with a church and red cross map markers"
    />
    <title>MASS NOW - MALTA</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main id="map" aria-label="Interactive 2.5D map of Malta"></main>

    <div class="church-search" id="church-search">
      <label class="sr-only" for="church-search-input">
        Search churches by name or address
      </label>
      <div class="church-search__field">
        <svg class="church-search__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m21 21-4.35-4.35m2.35-5.4A7.75 7.75 0 1 1 3.5 11.25a7.75 7.75 0 0 1 15.5 0Z" />
        </svg>
        <input
          id="church-search-input"
          type="search"
          placeholder="Search church or address"
          autocomplete="off"
          spellcheck="false"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="church-search-results"
          aria-expanded="false"
          disabled
        />
      </div>
      <div
        class="church-search__results"
        id="church-search-results"
        role="listbox"
        aria-label="Church search results"
        hidden
      ></div>
    </div>

    <button
      class="reset-view"
      id="reset-view"
      type="button"
      aria-label="Show the whole island"
      title="Whole island"
    >
      <span aria-hidden="true"><b>↻</b></span>
    </button>

    <button
      class="no-mass-toggle"
      id="no-mass-toggle"
      type="button"
      role="switch"
      aria-checked="false"
      aria-controls="map"
      aria-label="Show churches without Mass times"
      title="Show churches without Mass times"
    >
      <span class="no-mass-toggle__icon" aria-hidden="true"></span>
      <span class="no-mass-toggle__icon no-mass-toggle__icon--gray" aria-hidden="true"></span>
    </button>

    <div class="loading" id="loading" aria-live="polite">
      <div class="loading-card">Loading Malta…</div>
    </div>

    <div class="map-footer-links">
      <a
        class="powered-by"
        href="https://melamela.cloud/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Powered by melamela.cloud"
        title="Powered by melamela.cloud"
      >
        <img src="/logo-flat.png" alt="melamela.cloud" />
      </a>

      <a
        class="github-link"
        href="https://github.com/wangdongcheng/map-mass"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View Map Mass on GitHub"
        title="View source on GitHub"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.64 5.47 7.71.4.08.55-.18.55-.39 0-.19-.01-.83-.01-1.5-2.01.38-2.53-.5-2.69-.96-.09-.23-.48-.96-.82-1.15-.28-.15-.68-.53-.01-.54.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.53.28-.88.51-1.08-1.78-.21-3.64-.91-3.64-4.02 0-.89.31-1.62.82-2.19-.08-.21-.36-1.04.08-2.16 0 0 .67-.22 2.2.84A7.5 7.5 0 0 1 8 3.89a7.5 7.5 0 0 1 2 .27c1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.95.08 2.16.51.57.82 1.3.82 2.19 0 3.12-1.87 3.81-3.65 4.02.29.25.54.74.54 1.5 0 1.08-.01 1.95-.01 2.22 0 .22.15.47.55.39A8.13 8.13 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z" />
        </svg>
      </a>
      <a
        class="email-link"
        href="mailto:paul@mass.catholic.mt"
        aria-label="Email me feedback or more church photos to help make the churches look more realistic"
        title="Email me feedback or more church photos to help make the churches look more realistic"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect x="1" y="3" width="14" height="10" rx="1.5" />
          <path d="m1.5 3.5 6.5 5 6.5-5" />
        </svg>
      </a>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
