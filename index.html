<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive 2.5D map of Malta." />
    <meta name="theme-color" content="#1a6f8a" />
    <title>MASS NOW - MALTA</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main id="map" aria-label="Interactive 2.5D map of Malta"></main>

    <div class="church-search" id="church-search">
      <label class="sr-only" for="church-search-input">
        Search churches by name or address
      </label>
      <div class="church-search__field">
        <svg class="church-search__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m21 21-4.35-4.35m2.35-5.4A7.75 7.75 0 1 1 3.5 11.25a7.75 7.75 0 0 1 15.5 0Z" />
        </svg>
        <input
          id="church-search-input"
          type="search"
          placeholder="Search church or address"
          autocomplete="off"
          spellcheck="false"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="church-search-results"
          aria-expanded="false"
          disabled
        />
      </div>
      <div
        class="church-search__results"
        id="church-search-results"
        role="listbox"
        aria-label="Church search results"
        hidden
      ></div>
    </div>

    <button
      class="reset-view"
      id="reset-view"
      type="button"
      aria-label="Show the whole island"
      title="Whole island"
    >
      <span aria-hidden="true"><b>↻</b></span>
    </button>

    <div class="loading" id="loading" aria-live="polite">
      <div class="loading-card">Loading Malta…</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
